name: TechDocs

# Gera e publica a documentação deste repo no MinIO (arquitetura TechDocs
# "builder externo"). Toda a lógica está no workflow reutilizável do repo
# backstageIO — aqui só passamos a entidade do catálogo.
#
# Secret necessário no repo (Settings → Secrets → Actions):
#   MINIO_ROOT_USER / MINIO_ROOT_PASSWORD (mesmos do deploy do Backstage)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'catalog-info.yaml'
      - '.github/workflows/techdocs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    # main recebe as correções do publicador compartilhado sem depender de um
    # SHA antigo. Para produção, este ref pode voltar a ser fixado por SHA.
    uses: willsreistech/backstageIO/.github/workflows/techdocs-publish-reusable.yml@main
    secrets:
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
    with:
      # namespace/kind/name — deve bater com o catalog-info.yaml
      entity: default/component/k9-kind-lab
      runner: k9
      minio-endpoint: http://192.168.1.250:9000
