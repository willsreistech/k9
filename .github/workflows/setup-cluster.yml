name: 🚀 Setup Kind Cluster
on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: "Nome do cluster"
        required: false
        default: "lab-k8s"
        type: string
      install_dependencies:
        description: "Instalar/atualizar Kind e kubectl no usuario do runner"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: kind-host-production
  cancel-in-progress: false

jobs:
  setup:
    name: Install deps & create cluster
    runs-on: [self-hosted, production]
    environment: production
    timeout-minutes: 15
    env:
      CLUSTER_NAME: ${{ github.event.inputs.cluster_name || 'lab-k8s' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Kind & kubectl
        if: ${{ inputs.install_dependencies }}
        run: |
          bash scripts/install-deps.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Create Kind cluster
        run: bash scripts/setup-cluster.sh

      - name: Cluster info
        run: |
          export KUBECONFIG="$HOME/.kube/config-${CLUSTER_NAME}"
          kubectl cluster-info
          kubectl get nodes -o wide
          kubectl get pods -A
          kubectl wait --for=condition=Ready nodes --all --timeout=60s
