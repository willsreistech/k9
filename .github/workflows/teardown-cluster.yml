name: 🗑️ Teardown Kind Cluster
on:
  workflow_dispatch:
    inputs:
      cluster_name:
        description: "Nome do cluster a remover"
        required: false
        default: "lab-k8s"
        type: string

permissions:
  contents: read

concurrency:
  group: kind-host-production
  cancel-in-progress: false

jobs:
  teardown:
    name: Delete cluster
    runs-on: [self-hosted, production]
    environment: production
    timeout-minutes: 10
    env:
      CLUSTER_NAME: ${{ github.event.inputs.cluster_name || 'lab-k8s' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete Kind cluster
        run: bash scripts/teardown-cluster.sh

      - name: List remaining clusters
        run: kind get clusters 2>/dev/null || echo "Nenhum cluster ativo."
