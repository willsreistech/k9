kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab-k8s

# Topologia: 1 control-plane + 2 workers
nodes:
  - role: control-plane
    # Monta o diretório local para persistência de dados dos labs
    extraMounts:
      - hostPath: /tmp/kind-data
        containerPath: /data
    # Expõe portas do host → cluster para acesso externo
    extraPortMappings:
      - containerPort: 30080   # HTTP
        hostPort: 30080
        listenAddress: "0.0.0.0"
        protocol: TCP
      - containerPort: 30443   # HTTPS
        hostPort: 30443
        listenAddress: "0.0.0.0"
        protocol: TCP
      - containerPort: 30000   # porta genérica para NodePort
        hostPort: 30000
        listenAddress: "0.0.0.0"
        protocol: TCP

  - role: worker
    extraMounts:
      - hostPath: /tmp/kind-data
        containerPath: /data

  - role: worker
    extraMounts:
      - hostPath: /tmp/kind-data
        containerPath: /data

# Networking
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
  disableDefaultCNI: false   # usa kindnet por padrão (troque para true se quiser instalar Calico/Cilium)

# Feature gates úteis para laboratório
featureGates:
  StatefulSetAutoDeletePVC: true
