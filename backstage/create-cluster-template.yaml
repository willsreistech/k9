# ─────────────────────────────────────────────────────────────────────────────
# Template 1 — Criar Cluster Kind
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-kind-cluster
  title: 🚀 Criar Cluster Kind
  description: Provisiona um cluster Kubernetes local usando Kind no self-hosted runner. Instala Docker, Kind e kubectl se necessário.
  tags:
    - kubernetes
    - kind
    - infrastructure
spec:
  owner: user:default/wsr
  type: infrastructure

  parameters:
    - title: Configurar o cluster
      backstage:permissions:
        tags:
          - cluster-create
      required:
        - cluster_name
        - node_cpu
        - node_memory_gb
      properties:
        cluster_name:
          title: Nome do cluster
          type: string
          default: lab-k8s
          description: Nome usado para identificar o cluster Kind (ex. lab-k8s, dev-cluster, staging)
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          ui:autofocus: true
        # github:actions:dispatch exige todos os workflowInputs como string.
        node_cpu:
          title: vCPU por nó
          type: string
          default: "1"
          description: Limite de CPU aplicado a cada um dos 3 nós (perfil leve para demonstração)
          enum: ["1", "2", "4"]
          enumNames:
            - 1 vCPU — padrão
            - 2 vCPU
            - 4 vCPU
        node_memory_gb:
          title: Memória por nó (GiB)
          type: string
          default: "2"
          description: Limite de memória aplicado a cada um dos 3 nós (perfil leve para demonstração)
          enum: ["1", "2", "4", "8"]
          enumNames:
            - 1 GiB — mínimo
            - 2 GiB — padrão
            - 4 GiB
            - 8 GiB

  steps:
    - id: dispatch
      name: Disparar workflow setup-cluster
      action: github:actions:dispatch
      backstage:permissions:
        tags:
          - cluster-create
      input:
        repoUrl: github.com?owner=willsreistech&repo=k9
        workflowId: setup-cluster.yml
        branchOrTagName: main
        workflowInputs:
          cluster_name: ${{ parameters.cluster_name }}
          node_cpu: "${{ parameters.node_cpu }}"
          node_memory_gb: "${{ parameters.node_memory_gb }}"

  output:
    links:
      - title: Ver execução no GitHub Actions
        url: https://github.com/willsreistech/k9/actions/workflows/setup-cluster.yml
        icon: github
      - title: Repositório k9
        url: https://github.com/willsreistech/k9
        icon: github

---
# ─────────────────────────────────────────────────────────────────────────────
# Template 2 — Remover Cluster Kind
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: teardown-kind-cluster
  title: 🗑️ Remover Cluster Kind
  description: Remove um cluster Kind existente no self-hosted runner, liberando recursos.
  tags:
    - kubernetes
    - kind
    - infrastructure
spec:
  owner: user:default/wsr
  type: infrastructure

  parameters:
    - title: Identificar o cluster
      backstage:permissions:
        tags:
          - cluster-delete
      required:
        - cluster_name
      properties:
        cluster_name:
          title: Nome do cluster a remover
          type: string
          default: lab-k8s
          description: Deve corresponder exatamente ao nome usado na criação
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          ui:autofocus: true

  steps:
    - id: dispatch
      name: Disparar workflow teardown-cluster
      action: github:actions:dispatch
      backstage:permissions:
        tags:
          - cluster-delete
      input:
        repoUrl: github.com?owner=willsreistech&repo=k9
        workflowId: teardown-cluster.yml
        branchOrTagName: main
        workflowInputs:
          cluster_name: ${{ parameters.cluster_name }}

  output:
    links:
      - title: Ver execução no GitHub Actions
        url: https://github.com/willsreistech/k9/actions/workflows/teardown-cluster.yml
        icon: github

---
# ─────────────────────────────────────────────────────────────────────────────
# Template 3 — Verificar Status dos Clusters
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: status-kind-cluster
  title: 🔍 Verificar Status dos Clusters Kind
  description: Dispara o workflow de status para verificar os clusters Kind ativos e a saúde dos nós e pods.
  tags:
    - kubernetes
    - kind
    - infrastructure
spec:
  owner: user:default/wsr
  type: infrastructure

  parameters:
    - title: Confirmar verificação
      backstage:permissions:
        tags:
          - cluster-status
      properties:
        confirm:
          title: Disparar verificação de status agora?
          type: boolean
          default: true
          description: Será executado o cluster-status.yml no runner self-hosted

  steps:
    - id: dispatch
      name: Disparar workflow cluster-status
      action: github:actions:dispatch
      backstage:permissions:
        tags:
          - cluster-status
      input:
        repoUrl: github.com?owner=willsreistech&repo=k9
        workflowId: cluster-status.yml
        branchOrTagName: main

  output:
    links:
      - title: Ver resultado no GitHub Actions
        url: https://github.com/willsreistech/k9/actions/workflows/cluster-status.yml
        icon: github
